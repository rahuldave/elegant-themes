name: Build gallery
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked
      - run: node --check src/gallery.js
      - run: uv run python scripts/build.py
      - run: uv run python scripts/check.py
